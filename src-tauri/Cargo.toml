[package]
name = "memento"
version = "4.0.0"
description = "几度 · Memento"
authors = ["zhulongqihan"]
edition = "2021"

[features]
isolated-storage-test = []
isolated-storage-test-no-sql = ["isolated-storage-test"]

[lib]
name = "memento_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
