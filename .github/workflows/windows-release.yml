name: Windows Candidate

on:
  pull_request:
    paths-ignore: ['docs/**/*.md', 'docs/releases/*.json', 'README.md', 'PRODUCT.md']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve application version and paths
        id: application
        shell: pwsh
        run: |
          node --input-type=module -e "import { appVersion } from './scripts/release-config.mjs'; console.log('version=' + appVersion)" >> $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Application versions are inconsistent.' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../output/builds/memento-${{ steps.application.outputs.version }}
          cache-on-failure: true
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run copy:validate
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target-dir output/builds/memento-${{ steps.application.outputs.version }}
      - name: Build actual 3.1.0 upgrade baseline
        run: node scripts/build-legacy-baseline.mjs
      - name: Build final portable and installer
        run: npm run tauri:build
      - run: npm run release:verify
      - name: Verify browser user flows
        run: npm run test:ui
      - name: Verify final executables with the hosted runner Known Folder
        run: npm run test:native
      - name: Retain source provenance diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output/native-verification | Out-Null
          git status --porcelain=v1 --untracked-files=normal | Tee-Object -FilePath output/native-verification/source-status.txt
          git diff -- src src-tauri scripts public docs/design/assets .cargo index.html package.json package-lock.json vite.config.ts 'tsconfig*.json' | Out-File output/native-verification/source-diff.txt -Encoding utf8
          git config --show-origin --get core.autocrlf | Out-File output/native-verification/source-eol.txt -Encoding utf8
          git ls-files --eol src-tauri/Cargo.toml src-tauri/Cargo.lock | Add-Content output/native-verification/source-eol.txt
      - name: Retain exact candidate and evidence
        if: always() && steps.application.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: memento-windows-candidate-${{ github.sha }}
          path: |
            output/releases/${{ steps.application.outputs.version }}/
            output/playwright/release-${{ steps.application.outputs.version }}/
            output/native-verification/
          if-no-files-found: error
