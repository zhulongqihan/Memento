name: Windows Candidate

on:
  push:
    branches: ['codex/memento-v4']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../output/builds/memento-4.0.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run copy:validate
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build actual 3.1.0 upgrade baseline
        run: node scripts/build-legacy-baseline.mjs
      - name: Build final portable and installer
        run: npm run tauri:build
      - run: npm run release:verify
      - name: Verify browser user flows
        run: npm run test:ui
      - name: Verify final executables with the hosted runner Known Folder
        run: npm run test:native
      - name: Retain exact candidate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memento-windows-candidate-${{ github.sha }}
          path: |
            output/releases/4.0.0/
            output/playwright/v4-completion/
            output/native-verification/
          if-no-files-found: error
