name: Publish Windows Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/windows-release.yml
  publish:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: memento-windows-candidate-${{ github.sha }}
          path: output
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and publish the tested files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version differ.' }
          node scripts/release-manifest.mjs verify
          if ($LASTEXITCODE -ne 0) { throw 'Artifact checksum verification failed.' }
          $report = Get-Content output/native-verification/result.json -Raw | ConvertFrom-Json
          if ($report.status -ne 'passed') { throw 'Native verification did not pass.' }
          $files = @(Get-ChildItem -LiteralPath "output/releases/$version" -Recurse -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @files --repo $env:GITHUB_REPOSITORY --verify-tag --title "几度 · Memento v$version" --notes-file "docs/release-notes/v$version.md"
