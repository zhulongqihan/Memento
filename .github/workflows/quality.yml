name: Quality

on:
  push:
    branches: [main, 'feature/v1.0.0-desktop']
    paths-ignore: ['docs/**/*.md', 'docs/releases/*.json', 'README.md', 'PRODUCT.md']
  pull_request:
    paths-ignore: ['docs/**/*.md', 'docs/releases/*.json', 'README.md', 'PRODUCT.md']

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Validate local copy library
        run: npm run copy:validate
      - name: Production build
        run: npm run build

